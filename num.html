<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input id="inp">
  <button onclick="myfunc()">click me</button>
  <div id="display"></div>

  <script>
    const myfunc = ()=>{
      let val = Number(inp.value)
      if (val > 100){
        display.innerText = "Out of Range"
      }
      else if (val >=70 && val <=100 ){
        display.innerText = "Excellent"
      }
      else if (val >=60 && val <=69 ){
        display.innerText = "Good"
      }
      else if (val >=50 && val <=59 ){
        display.innerText = "Average"
      }
      else if (val >=45 && val <=49 ){
        display.innerText = "Fair"
      }
      else if (val >=40 && val <=44 ){
        display.innerText = "Pass"
      }
      else if (val <= 40 && val <= 0 ){
        display.innerText = "Fail"
      }
      else(val < 0 )
        display.innerText = "Out of Range"
      
      }
    
  </script>
</body>
</html>
