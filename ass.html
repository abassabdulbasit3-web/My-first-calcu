<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Login 1</h1>
  <input type="email" placeholder="Enter email" id="box1">
  <input type="password" placeholder="Enter password" id="box2">

  <h1>Login 2</h1>
  <input type="email" placeholder="Enter email" id="box3">
  <input type="password" placeholder="Enter Password" id="box4">
  <button onclick="login()">click me</button>
  <div id="result"></div>
  <script>
    const login = () =>{
      let email1 = box1.value;
      let password1 = box2.value;
      let email2 = box3.value;
      let password2 = box4.value;
        if (email1 === email2 && password1 === password2){
          result.innerText = "Login details successfullly"
        }else{
          result.innerText = "Wrong login"
        }
    }
  </script>


</body>
</html>
